name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      # Brief-quality checks: structure, score fidelity, honest UNKNOWNs,
      # banned filler, date/amount grounding. Fixture-based, so no database,
      # AWS or Neo4j credentials are needed. The full eval (which generates
      # real briefs) requires a live environment and is run manually:
      #   python evaluation/eval_runner.py
      - name: Run evaluation unit tests
        run: python -m unittest discover -s evaluation -v

      - name: Test API health endpoint
        run: |
          python -c "
          import subprocess, time, requests
          proc = subprocess.Popen(['python', 'api/run.py'])
          time.sleep(5)
          r = requests.get('http://localhost:8000/health')
          assert r.status_code == 200, f'Health check failed: {r.status_code}'
          assert r.json()['status'] == 'healthy'
          print('Health check passed')
          proc.terminate()
          "
