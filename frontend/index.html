<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vendor Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 400;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 40px;
        }

        .search-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input-group input {
            flex: 1;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .search-input-group input::placeholder {
            color: #64748b;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: #60a5fa;
            background: #0f172a;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .search-input-group button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .search-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
        }

        .search-input-group button:active {
            transform: translateY(0);
        }

        .search-input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Quick Select Chips */
        .quick-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .chip {
            padding: 8px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .chip:hover {
            border-color: #60a5fa;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
        }

        .chip:active {
            background: rgba(96, 165, 250, 0.2);
        }

        /* Loading State */
        .loading-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .loading-state.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(96, 165, 250, 0.2);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-message {
            font-size: 1.1rem;
            color: #cbd5e1;
            min-height: 30px;
        }

        /* Error State */
        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            border-radius: 8px;
            padding: 16px;
            color: #fca5a5;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .error-banner.show {
            display: block;
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .company-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: #f1f5f9;
        }

        /* Score Cards */
        .score-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .score-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
        }

        .score-card:hover {
            border-color: #475569;
            transform: translateY(-4px);
        }

        .score-card.sentiment {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .score-label {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .score-value.green {
            color: #4ade80;
        }

        .score-value.yellow {
            color: #facc15;
        }

        .score-value.red {
            color: #f87171;
        }

        .score-max {
            color: #64748b;
            font-size: 1rem;
            font-weight: 400;
        }

        .sentiment-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .sentiment-badge.positive {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .sentiment-badge.neutral {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
        }

        .sentiment-badge.negative {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        /* Accordion Panels */
        .accordion {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }

        .accordion-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        .accordion-header {
            padding: 18px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: all 0.2s;
            font-weight: 600;
            color: #e2e8f0;
        }

        .accordion-header:hover {
            background: rgba(96, 165, 250, 0.05);
        }

        .accordion-toggle {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            color: #94a3b8;
            transition: transform 0.3s;
            font-size: 0.8rem;
        }

        .accordion-panel.expanded .accordion-toggle {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 24px;
        }

        .accordion-panel.expanded .accordion-content {
            max-height: 1000px;
            padding: 0 24px 24px 24px;
        }

        .accordion-content p {
            color: #cbd5e1;
            line-height: 1.8;
        }

        /* Footer */
        .footer {
            border-top: 1px solid #334155;
            padding-top: 24px;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .data-sources {
            display: flex;
            gap: 12px;
        }

        .timestamp {
            color: #64748b;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .search-input-group {
                flex-direction: column;
            }

            .score-cards {
                grid-template-columns: 1fr;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .quick-select {
                gap: 8px;
            }

            .chip {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }

        /* Markdown rendering */
        .markdown-content strong {
            color: #60a5fa;
            font-weight: 600;
        }

        /* Confidence / human-review banner */
        .confidence-banner {
            display: none;
            margin: 12px 0 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            border: 1px solid transparent;
        }
        .confidence-banner.show { display: block; }
        .confidence-banner.warn {
            background: rgba(234, 179, 8, 0.12);
            border-color: rgba(234, 179, 8, 0.4);
            color: #eab308;
        }
        .confidence-banner.reviewed {
            background: rgba(34, 197, 94, 0.10);
            border-color: rgba(34, 197, 94, 0.35);
            color: #22c55e;
        }
        .confidence-banner .banner-title { font-weight: 600; }
        .confidence-banner .banner-dims {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 0.82rem;
        }

        /* Reviewer panel */
        .review-toggle {
            margin-top: 14px;
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .review-toggle:hover { border-color: #475569; color: #cbd5e1; }
        .review-count {
            display: inline-block;
            min-width: 18px;
            padding: 0 6px;
            margin-left: 6px;
            border-radius: 9px;
            background: #eab308;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .review-count.empty { background: #334155; color: #94a3b8; }
        .review-panel {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
        }
        .review-panel.show { display: block; }
        .review-panel-title { margin: 0 0 12px; font-size: 1rem; color: #e2e8f0; }
        .review-item {
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .review-item h4 { margin: 0 0 4px; color: #f1f5f9; }
        .review-item .ri-meta { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; }
        .review-item textarea {
            width: 100%;
            box-sizing: border-box;
            background: #0b1120;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.85rem;
            margin-bottom: 8px;
            resize: vertical;
        }
        .review-item .ri-brief {
            max-height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: #0b1120;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .review-item button {
            background: #22c55e;
            border: none;
            color: #052e16;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .review-empty { color: #64748b; font-size: 0.85rem; }

        /* Evidence & sources */
        .evidence-section { margin-top: 28px; }
        .evidence-section > h3 {
            font-size: 1.05rem;
            color: #e2e8f0;
            margin: 0 0 4px;
        }
        .evidence-section > .evidence-sub {
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }
        .evidence-group { margin-bottom: 18px; }
        .evidence-group h4 {
            margin: 0 0 8px;
            font-size: 0.9rem;
            color: #60a5fa;
            text-transform: capitalize;
        }
        .evidence-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .evidence-item .ev-date {
            flex-shrink: 0;
            color: #64748b;
            font-variant-numeric: tabular-nums;
            width: 92px;
        }
        .evidence-item .ev-body { flex: 1; }
        .evidence-item .ev-type {
            display: inline-block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #94a3b8;
            background: #1e293b;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .evidence-item a { color: #cbd5e1; text-decoration: none; }
        .evidence-item a:hover { color: #60a5fa; text-decoration: underline; }
        .evidence-item .ev-score {
            flex-shrink: 0;
            color: #64748b;
            font-size: 0.78rem;
        }
        .evidence-empty { color: #64748b; font-size: 0.82rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>AI Vendor Intelligence Platform</h1>
            <p class="subtitle">Vendor intelligence briefs powered by LangGraph + AWS Bedrock</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-input-group">
                <input
                    type="text"
                    id="companyInput"
                    placeholder="Enter AI company name e.g. Cohere, Anthropic, Mistral..."
                    autocomplete="off"
                >
                <button id="analyzeBtn" onclick="handleSearch()">Analyze</button>
            </div>

            <div class="quick-select" id="quickSelectContainer"></div>

            <button id="reviewToggle" class="review-toggle" onclick="toggleReviewPanel()">
                Review queue <span id="reviewCount" class="review-count">0</span>
            </button>
        </div>

        <!-- Reviewer Panel (solo reviewer) -->
        <div class="review-panel" id="reviewPanel">
            <h3 class="review-panel-title">Briefs pending human review</h3>
            <div id="reviewList"></div>
        </div>

        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner"></div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div class="loading-message" id="loadingMessage">Querying SEC EDGAR filings...</div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <h2 class="company-name" id="companyName"></h2>

            <!-- Confidence / human-review banner -->
            <div class="confidence-banner" id="confidenceBanner"></div>

            <!-- Score Cards -->
            <div class="score-cards" id="scoreCards"></div>

            <!-- Accordion Panels -->
            <div class="accordion" id="accordionContainer"></div>

            <!-- Evidence & Sources -->
            <div class="evidence-section" id="evidenceSection"></div>

            <!-- Footer -->
            <div class="footer">
                <div class="data-sources">
                    Data sources:
                    <span>SEC EDGAR</span>
                    <span>·</span>
                    <span>GitHub</span>
                    <span>·</span>
                    <span>ArXiv</span>
                    <span>·</span>
                    <span>Google News</span>
                    <span>·</span>
                    <span>Neo4j</span>
                </div>
                <div class="timestamp" id="timestamp"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const COMPANIES = ['Anthropic', 'OpenAI', 'Cohere', 'Mistral', 'Scale AI', 'Hugging Face', 'Perplexity', 'LangChain', 'Pinecone', 'Nvidia'];
        const LOADING_MESSAGES = [
            'Querying SEC EDGAR filings...',
            'Analyzing GitHub activity...',
            'Processing ArXiv research papers...',
            'Scanning news signals...',
            'Building competitive landscape...',
            'Synthesizing brief...'
        ];

        let currentMessageIndex = 0;
        let loadingInterval = null;

        // Initialize quick select chips
        function initializeQuickSelect() {
            const container = document.getElementById('quickSelectContainer');
            COMPANIES.forEach(company => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.textContent = company;
                chip.onclick = () => {
                    document.getElementById('companyInput').value = company;
                    handleSearch();
                };
                container.appendChild(chip);
            });
        }

        // Handle search
        async function handleSearch() {
            const input = document.getElementById('companyInput');
            const company = input.value.trim();

            if (!company) {
                input.focus();
                return;
            }

            showLoading();
            hideError();

            try {
                const response = await fetch(`${API_BASE}/brief`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ company })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                renderBrief(company, data.brief, data);
            } catch (error) {
                console.error('Error:', error);
                showError(company);
            } finally {
                hideLoading();
            }
        }

        // Parse brief text.
        //
        // Parsed line-by-line rather than with a single big regex, because the
        // model varies its header format between runs: sometimes the score sits
        // INSIDE the bold ("**FINANCIAL HEALTH: 75/100**"), sometimes OUTSIDE
        // ("**FINANCIAL HEALTH:** 75/100"), and the Executive Summary body now
        // contains its own bold markdown (**Recommendation:**, - **Verdict:**).
        // A header is defined as a line that STARTS with ** followed by an
        // ALL-CAPS label and a colon — everything else is section body. This
        // keeps inner bold (mixed-case labels like "Recommendation") as body.
        function parseBrief(briefText) {
            const result = { sections: {}, scores: {}, sentiment: null };
            const headerRe = /^\*\*\s*([A-Z][A-Z0-9 &\/]*?)\s*:\s*(.*)$/;

            let current = null;
            let buffer = [];
            const flush = () => {
                if (current !== null) {
                    result.sections[current] = buffer.join('\n')
                        .replace(/\*+\s*$/, '').trim();
                }
            };

            briefText.split('\n').forEach((line) => {
                const m = line.match(headerRe);
                if (!m) { buffer.push(line); return; }

                flush();
                current = m[1].trim();
                buffer = [];

                // Inline value on the header line (strip bold markers).
                const inline = (m[2] || '').replace(/\*+/g, '').trim();

                if (/^NEWS\s*&\s*SENTIMENT$/i.test(current)) {
                    const s = inline.match(/(positive|neutral|negative)/i);
                    if (s) {
                        result.sentiment = s[1][0].toUpperCase() +
                            s[1].slice(1).toLowerCase();
                    }
                }
                if (/HEALTH|MOMENTUM|STABILITY/i.test(current)) {
                    const sc = inline.match(/(\d+)\s*\/\s*100/) ||
                        inline.match(/^(\d{1,3})\b/);
                    if (sc) result.scores[current] = parseInt(sc[1]);
                }
            });
            flush();

            return result;
        }

        // Render brief results
        function renderBrief(company, briefText, meta = {}) {
            const parsed = parseBrief(briefText);

            // Company name
            document.getElementById('companyName').textContent = company;

            // Confidence / human-review banner
            renderConfidenceBanner(meta);

            // Score cards
            renderScoreCards(parsed.scores, parsed.sentiment);

            // Accordion panels
            renderAccordion(parsed.sections);

            // Evidence & sources
            renderEvidence(meta.evidence);

            // Timestamp
            const now = new Date();
            document.getElementById('timestamp').textContent = `Generated ${now.toLocaleTimeString()}`;

            // Show results
            document.getElementById('resultsSection').classList.add('show');
        }

        // Render the confidence / human-review banner
        function renderConfidenceBanner(meta) {
            const banner = document.getElementById('confidenceBanner');
            banner.className = 'confidence-banner';
            banner.innerHTML = '';

            const status = meta.review_status;
            if (status === 'needs_review') {
                banner.classList.add('show', 'warn');
                const anomalies = (meta.confidence && meta.confidence.anomalies) || [];
                const anomalyMarkup = anomalies.length
                    ? `<div class="banner-dims">Anomalies: ${anomalies.map(escapeHtml).join(' · ')}</div>`
                    : '';
                banner.innerHTML =
                    `<div class="banner-title">⚠ Low confidence — pending human review</div>` +
                    `<div>This brief was generated from limited or noisy data and has not yet been verified by a reviewer. Treat scores as provisional.</div>` +
                    anomalyMarkup +
                    dimsMarkup(meta.confidence);
            } else if (status === 'reviewed') {
                banner.classList.add('show', 'reviewed');
                banner.innerHTML =
                    `<div class="banner-title">✓ Reviewed by a human</div>` +
                    `<div>This brief was flagged for low confidence and has since been verified by a reviewer.</div>`;
            }
            // 'auto_ok' → no banner
        }

        // Render the evidence / sources behind the brief
        const EVIDENCE_LABELS = {
            financial: 'Financial signals',
            technology: 'Technology signals',
            news: 'News & sentiment',
            personnel: 'Personnel changes',
        };

        function renderEvidence(evidence) {
            const container = document.getElementById('evidenceSection');
            container.innerHTML = '';
            if (!evidence) return;

            const total = Object.values(evidence)
                .reduce((n, items) => n + (items ? items.length : 0), 0);
            if (total === 0) return;

            const heading = document.createElement('h3');
            heading.textContent = 'Evidence & sources';
            const sub = document.createElement('div');
            sub.className = 'evidence-sub';
            sub.textContent = `${total} collected signals backing this brief — click any headline to verify the source.`;
            container.appendChild(heading);
            container.appendChild(sub);

            ['financial', 'technology', 'news', 'personnel'].forEach((dim) => {
                const items = evidence[dim] || [];
                if (items.length === 0) return;
                const group = document.createElement('div');
                group.className = 'evidence-group';
                const h4 = document.createElement('h4');
                h4.textContent = `${EVIDENCE_LABELS[dim] || dim} (${items.length})`;
                group.appendChild(h4);
                items.forEach((it) => group.appendChild(createEvidenceItem(it)));
                container.appendChild(group);
            });
        }

        function createEvidenceItem(it) {
            const row = document.createElement('div');
            row.className = 'evidence-item';
            const headline = escapeHtml(it.headline || '(no headline)');
            const linked = it.source_url
                ? `<a href="${escapeHtml(it.source_url)}" target="_blank" rel="noopener">${headline}</a>`
                : headline;
            const score = (it.importance !== null && it.importance !== undefined)
                ? `<span class="ev-score">${it.importance}</span>` : '';
            row.innerHTML =
                `<span class="ev-date">${it.date || '—'}</span>` +
                `<span class="ev-body"><span class="ev-type">${escapeHtml(it.signal_type || '')}</span>${linked}</span>` +
                score;
            return row;
        }

        // Render a compact per-dimension confidence line
        function dimsMarkup(confidence) {
            if (!confidence || !confidence.dimensions) return '';
            const parts = Object.entries(confidence.dimensions).map(
                ([dim, info]) => `${dim}: ${info.level}`
            );
            return `<div class="banner-dims">Confidence by dimension — ${parts.join(' · ')}</div>`;
        }

        // Render score cards
        function renderScoreCards(scores, sentiment) {
            const container = document.getElementById('scoreCards');
            container.innerHTML = '';

            // Financial Health
            if (scores['FINANCIAL HEALTH']) {
                container.appendChild(createScoreCard('Financial Health', scores['FINANCIAL HEALTH']));
            }

            // Technology Momentum
            if (scores['TECHNOLOGY MOMENTUM']) {
                container.appendChild(createScoreCard('Technology Momentum', scores['TECHNOLOGY MOMENTUM']));
            }

            // News Sentiment
            if (sentiment) {
                container.appendChild(createSentimentCard(sentiment));
            }

            // Personnel Stability
            if (scores['PERSONNEL STABILITY']) {
                container.appendChild(createScoreCard('Personnel Stability', scores['PERSONNEL STABILITY']));
            }
        }

        // Create score card
        function createScoreCard(label, score) {
            const card = document.createElement('div');
            card.className = 'score-card';

            let colorClass = 'green';
            if (score < 60) colorClass = 'red';
            else if (score < 80) colorClass = 'yellow';

            card.innerHTML = `
                <div class="score-label">${label}</div>
                <div class="score-value ${colorClass}">${score}<span class="score-max">/100</span></div>
            `;
            return card;
        }

        // Create sentiment card
        function createSentimentCard(sentiment) {
            const card = document.createElement('div');
            card.className = 'score-card sentiment';

            const sentimentLower = sentiment.toLowerCase();
            card.innerHTML = `
                <div class="score-label">News Sentiment</div>
                <span class="sentiment-badge ${sentimentLower}">${sentiment}</span>
            `;
            return card;
        }

        // Render accordion
        function renderAccordion(sections) {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';

            const sectionOrder = [
                'FINANCIAL HEALTH',
                'TECHNOLOGY MOMENTUM',
                'NEWS & SENTIMENT',
                'PERSONNEL STABILITY',
                'COMPETITIVE POSITION',
                'EXECUTIVE SUMMARY'
            ];

            const expandByDefault = ['FINANCIAL HEALTH', 'EXECUTIVE SUMMARY'];

            sectionOrder.forEach(sectionKey => {
                if (sections[sectionKey]) {
                    const content = sections[sectionKey];
                    const isExpanded = expandByDefault.includes(sectionKey);
                    container.appendChild(createAccordionPanel(sectionKey, content, isExpanded));
                }
            });
        }

        // Create accordion panel
        function createAccordionPanel(title, content, expanded = false) {
            const panel = document.createElement('div');
            panel.className = 'accordion-panel' + (expanded ? ' expanded' : '');

            const htmlContent = renderMarkdown(content);

            panel.innerHTML = `
                <div class="accordion-header" onclick="togglePanel(this.parentElement)">
                    <span>${title}</span>
                    <span class="accordion-toggle">▼</span>
                </div>
                <div class="accordion-content">
                    <p>${htmlContent}</p>
                </div>
            `;
            return panel;
        }

        // Toggle accordion panel
        function togglePanel(panel) {
            panel.classList.toggle('expanded');
        }

        // Render markdown (basic ** support)
        function renderMarkdown(text) {
            return text
                .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
                .replace(/^\s*[-*]\s+/gm, '• ')
                .replace(/\n/g, '<br>');
        }

        // Loading state
        function showLoading() {
            document.getElementById('resultsSection').classList.remove('show');
            document.getElementById('loadingState').classList.add('show');
            document.getElementById('analyzeBtn').disabled = true;

            currentMessageIndex = 0;
            updateLoadingMessage();
            loadingInterval = setInterval(updateLoadingMessage, 3000);
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.remove('show');
            document.getElementById('analyzeBtn').disabled = false;
            if (loadingInterval) {
                clearInterval(loadingInterval);
            }
        }

        function updateLoadingMessage() {
            document.getElementById('loadingMessage').textContent = LOADING_MESSAGES[currentMessageIndex];
            currentMessageIndex = (currentMessageIndex + 1) % LOADING_MESSAGES.length;
        }

        // Error state
        function showError(company) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = `Could not generate brief for ${company}. The company may not be in our dataset or the service is unavailable.`;
            banner.classList.add('show');
            document.getElementById('resultsSection').classList.remove('show');
        }

        function hideError() {
            document.getElementById('errorBanner').classList.remove('show');
        }

        // Enter key support
        document.getElementById('companyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        // ---------------------------------------------------------------
        // Reviewer panel (solo reviewer)
        // ---------------------------------------------------------------

        async function refreshReviewCount() {
            try {
                const res = await fetch(`${API_BASE}/review-queue`);
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('reviewCount');
                badge.textContent = data.count;
                badge.classList.toggle('empty', data.count === 0);
                return data;
            } catch (e) {
                console.error('Review count refresh failed:', e);
            }
        }

        async function toggleReviewPanel() {
            const panel = document.getElementById('reviewPanel');
            const opening = !panel.classList.contains('show');
            panel.classList.toggle('show', opening);
            if (opening) await loadReviewQueue();
        }

        async function loadReviewQueue() {
            const list = document.getElementById('reviewList');
            list.innerHTML = '<div class="review-empty">Loading…</div>';
            const data = await refreshReviewCount();
            if (!data || data.count === 0) {
                list.innerHTML = '<div class="review-empty">Nothing pending review. 🎉</div>';
                return;
            }
            list.innerHTML = '';
            data.items.forEach((item) => list.appendChild(createReviewItem(item)));
        }

        function createReviewItem(item) {
            const el = document.createElement('div');
            el.className = 'review-item';
            const overall = item.confidence ? item.confidence.overall : 'unknown';
            el.innerHTML =
                `<h4>${item.company}</h4>` +
                `<div class="ri-meta">${item.cache_date} · overall confidence: ${overall}</div>` +
                `<div class="ri-brief">${escapeHtml(item.brief)}</div>` +
                `<textarea rows="2" placeholder="Reviewer notes / corrected brief (optional)"></textarea>` +
                `<button>Approve</button>`;
            const textarea = el.querySelector('textarea');
            el.querySelector('button').addEventListener('click', () =>
                approveBrief(item.id, textarea.value, el)
            );
            return el;
        }

        async function approveBrief(id, notes, el) {
            const btn = el.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Saving…';
            try {
                const res = await fetch(`${API_BASE}/review/${id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes: notes || null }),
                });
                if (!res.ok) throw new Error(`API error: ${res.status}`);
                el.remove();
                await loadReviewQueue();
            } catch (e) {
                console.error('Approve failed:', e);
                btn.disabled = false;
                btn.textContent = 'Retry';
            }
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeQuickSelect();
            refreshReviewCount();
        });
    </script>
</body>
</html>
